    .mode::before {
      content: "";
      position: absolute;
      top: 3px; bottom: 3px; left: 3px;
      width: calc(50% - 3px);
      border-radius: 999px;
      background: var(--fg);
      transition: transform 0.3s cubic-bezier(0.3, 0.7, 0.2, 1);
    }
    .mode[aria-checked="false"] .h, .mode[aria-checked="true"] .a { color: var(--bg); }
    .mode[aria-checked="true"]::before { transform: translateX(100%); }

    .ai-view { display: none; width: 100%; max-width: 44rem; text-align: left; }

    body.ai main { justify-content: flex-start; padding-top: 5rem; }

  <script>
    (function () {
      var link = document.querySelector('.copy-email');
      var toast = document.querySelector('.toast');
      var timer;
      link.addEventListener('click', function (e) {
        var email = link.dataset.email;
        if (!navigator.clipboard) return;
        e.preventDefault();
        navigator.clipboard.writeText(email).then(function () {
          toast.textContent = 'Email copied';
        }, function () {
          toast.textContent = email;
        });
        clearTimeout(timer);
        timer = setTimeout(function () { toast.textContent = ''; }, 3000);
      });
    })();
    (function () {
      var toggle = document.querySelector('.mode');
      var pre = document.querySelector('.ai-view pre');
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var text = null, run = 0;
      function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
      function linkify(t) {
        return esc(t).replace(/(https?:\/\/[^\s)]+|mailto:[^\s)]+)/g, function (u) {
          return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
        });
      }
      function render() {
        var id = ++run;
        if (still) { pre.innerHTML = linkify(text); return; }
        var lines = text.split('\n'), i = 0;
        pre.textContent = '';
        (function step() {
          if (id !== run) return;
          i += 2;
          pre.innerHTML = linkify(lines.slice(0, i).join('\n'));
          if (i < lines.length) setTimeout(step, 16);
        })();
      }
      function set(ai) {
        document.body.classList.toggle('ai', ai);
        toggle.setAttribute('aria-checked', String(ai));
        history.replaceState(null, '', ai ? '#ai' : location.pathname);
        if (!ai) { run++; return; }
        if (text !== null) return render();
        fetch('/llms.txt').then(function (r) { return r.text(); }).then(function (t) {
          text = t; render();
        }, function () {
          pre.innerHTML = 'Could not load. Read it at <a href="/llms.txt">/llms.txt</a>.';
        });
      }
      toggle.addEventListener('click', function () {
        set(toggle.getAttribute('aria-checked') !== 'true');
      });
      if (location.hash === '#ai') set(true);
      window.addEventListener('hashchange', function () { set(location.hash === '#ai'); });
    })();
  </script>
